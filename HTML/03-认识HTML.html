  <h1>什么是HTML？</h1>
  <hr>
  <p>HTML（超文本标记语言 HyperText Markup Language）是构建网页的基础标记语言，负责定义网页的内容与结构，相当于页面的"骨架"。它通过一系列标签,把文字、图片、链接等内容组织成浏览器可识别的层级结构。HTML 并非编程语言，本身不具备逻辑运算能力，常与 CSS（负责样式）和 JavaScript（负责交互）配合使用，三者共同构成现代网页开发的核心技术栈。几乎所有网站页面都由 HTML 编写而成，是 Web 开发入门的第一步。</p>
