<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08-元素分类.html</title>
</head>

<body>
  <!-- 块级元素 -->
  <h1>h1是块级元素</h1>
  <p>p也是块级元素</p>
  <p>
    <strong>加粗</strong>
  </p>
  <hr>
  <!-- 行内元素（内联元素） -->
  <strong>strong是内联元素</strong><strong>strong是内联元素</strong>
  <strong>
    <!-- <p>不要行内包块级</p> -->
  </strong>
  <hr>
  <!-- 特殊情况 p里面不能包含其他块级元素 -->
  <p>
    <p>段落</p>
  </p>

  <p>
    <h1>标题</h1>
  </p>

  <p>
    <strong>p包行内元素是可以的</strong>
  </p>

</body>

</html>
